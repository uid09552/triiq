site_name: TriIQ
site_description: Endurance and triathlon training companion for Intervals.icu — with an AI trainer and no backend.
site_url: https://uid09552.github.io/triiq/
repo_url: https://github.com/uid09552/triiq
repo_name: uid09552/triiq
edit_uri: edit/main/docs/
copyright: TriIQ is MIT-licensed. Not affiliated with Intervals.icu. Not medical advice.

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    logo: material/run-fast
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Features: features.md
  - AI trainer: ai-trainer.md
  - Privacy & data: privacy.md
  - Releases: releases.md
  - Development: development.md
  - Specification: okf.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  links:
    not_found: warn
    anchors: warn
