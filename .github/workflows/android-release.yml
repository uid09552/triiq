# Builds the Android release APK and publishes it as a GitHub release.
#
# Triggers: pushing a tag `v*` (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# creates a release with the APK attached; running it manually
# (Actions → Android release → Run workflow) only uploads the APK as a
# build artifact.
#
# Signing: set these repository secrets for a stable release key. Without
# them the APK is signed with a throwaway debug key, and updates over an
# installed copy will fail whenever that key changes.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            flutter build apk --release --build-name="$NAME" --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/triiq-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: triiq-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
