# Builds the Android release APK and publishes it as a GitHub release.
#
# Triggers
#   * push to `main` (a merged PR): builds, then creates the tag
#     `v<pubspec version>-rc<short commit hash>` (e.g. `v0.9.1-rc1a2b3c4`) and
#     publishes it as a **pre-release**. The base version is the one in
#     pubspec.yaml (`version: 0.9.1+1` -> 0.9.1): bump it there for a new line.
#   * push of a tag `v*` (e.g. `git tag v1.0.0 && git push origin v1.0.0`):
#     builds and publishes a release for exactly that tag, with that version.
#     A tag containing `-` (v1.0.0-beta1) is marked as a pre-release.
#   * manual run (Actions -> Android release -> Run workflow): only uploads the
#     APK as a build artifact, no tag, no release.
# Skip the automatic release for a commit by putting `[skip release]` in the
# merge commit message. (A tag created by this workflow does not trigger it
# again: tags made with the built-in token never start workflows.)
#
# Signing: set these repository secrets for a stable release key. Without
# them the APK is signed with a throwaway debug key, and updates over an
# installed copy will fail whenever that key changes.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A merge to main releases unless its commit message says otherwise.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          BASE="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Cannot read a x.y.z version from pubspec.yaml (got '$BASE')."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Your tag, used as is.
            TAG="${GITHUB_REF_NAME}"
            NAME="${TAG#v}"
            PUBLISH=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="v${BASE}-rc${GITHUB_SHA::7}"
            NAME="${TAG#v}"
            PUBLISH=true
          else
            TAG=""
            NAME="${BASE}-dev${GITHUB_RUN_NUMBER}"
            PUBLISH=false
          fi
          case "$NAME" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (tag '${TAG:-none}', publish $PUBLISH, pre-release $PRE)"

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The sqlite3 package downloads its prebuilt libsqlite3.so per ABI from
      # GitHub releases during the build and checks the hash. When GitHub
      # answers with a 504 page the hash fails and so does the build; one
      # flaky download should not cost the release, so the build is retried
      # with a growing pause. A real build error fails every attempt alike.
      - name: Build APK
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --release \
                --build-name="${{ steps.ver.outputs.name }}" \
                --build-number="${GITHUB_RUN_NUMBER}"; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::flutter build apk failed 4 times"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::flutter build apk failed (attempt $attempt), retrying in ${delay}s"
            sleep "$delay"
          done
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/triiq-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: triiq-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # For a pushed tag this is that tag; for a merge to main the
          # release creates the tag on the merged commit.
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: dist/*.apk
          generate_release_notes: true
